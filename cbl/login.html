<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Data Diamond — Sign In</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0e1525;
      font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
      color: #e8eaf0;
    }
    .login-card {
      background: #161e30;
      border: 1px solid rgba(255,184,28,0.2);
      border-radius: 16px;
      padding: 48px 40px;
      width: 100%;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 8px 40px rgba(0,0,0,0.5);
    }
    .login-logo { display:flex; align-items:center; justify-content:center; margin-bottom:8px; }
    .login-title {
      font-size: 26px;
      font-weight: 700;
      color: #FFB81C;
      letter-spacing: -0.5px;
      margin-bottom: 4px;
    }
    .login-title em { color:#fff; font-style:normal; }
    .login-subtitle { font-size:13px; color:#8a93a8; margin-bottom:36px; }
    .divider {
      display:flex; align-items:center; gap:12px;
      margin-bottom:28px; color:#3a4255; font-size:12px;
    }
    .divider::before, .divider::after { content:''; flex:1; height:1px; background:rgba(255,184,28,0.1); }
    #signin-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 13px 20px;
      background: #fff;
      border: none;
      border-radius: 6px;
      color: #1f1f1f;
      font-family: 'Inter', 'Segoe UI', sans-serif;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      margin-bottom: 16px;
      transition: background 0.2s;
    }
    #signin-btn:hover { background: #f0f0f0; }
    #signin-btn:disabled { opacity:0.6; cursor:not-allowed; }
    #login-error { min-height:20px; font-size:13px; color:#ff6b6b; margin-top:8px; font-family:monospace; }
    .login-footer { margin-top:32px; font-size:11px; color:#3a4255; }
    .password-field { width:100%; margin-bottom:14px; text-align:left; }
    .password-field label { display:block; margin-bottom:7px; color:#aeb7cb; font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; }
    .password-field input { width:100%; padding:13px 14px; border:1px solid #35405a; border-radius:6px; background:#0e1525; color:#fff; font:15px 'Inter','Segoe UI',sans-serif; outline:none; }
    .password-field input:focus { border-color:#FFB81C; box-shadow:0 0 0 3px rgba(255,184,28,.12); }
    .remember-password { display:flex; align-items:center; gap:8px; margin:0 0 18px; color:#aeb7cb; font-size:12px; text-align:left; cursor:pointer; }
    .remember-password input { width:15px; height:15px; accent-color:#FFB81C; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-logo">
      <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" style="width:48px;height:48px">
        <polygon points="20,2 38,20 20,38 2,20" stroke="#FFB81C" stroke-width="2.5" fill="none"/>
        <polygon points="20,9 31,20 20,31 9,20" stroke="#FFB81C" stroke-width="1.5" fill="rgba(255,184,28,0.12)"/>
        <circle cx="20" cy="20" r="3" fill="#FFB81C"/>
      </svg>
    </div>
    <div class="login-title">Data<em>Diamond</em></div>
    <div class="login-subtitle">CBL Advanced Analytics</div>
    <div class="divider">enter password to continue</div>
    <form id="password-form">
      <div class="password-field">
        <label for="password">Dashboard password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required autofocus />
      </div>
      <label class="remember-password"><input id="remember-password" type="checkbox" checked /> Save this sign-in on this device</label>
      <button id="signin-btn" type="submit">Sign in</button>
    </form>

    <div id="login-error"></div>
    <div class="login-footer">Access is restricted to authorised users only.</div>
  </div>

  <script>
    (function () {
      var accessKey = 'dd_cbl_password_access';
      var hasAccess = localStorage.getItem(accessKey) === '1' || sessionStorage.getItem(accessKey) === '1';
      var returnTo = localStorage.getItem('dd_return_to') || 'index.html';
      if (hasAccess) window.location.replace(returnTo);

      document.getElementById('password-form').addEventListener('submit', function (event) {
        event.preventDefault();
        var password = document.getElementById('password').value;
        var remember = document.getElementById('remember-password').checked;
        var error = document.getElementById('login-error');
        if (password !== 'GUEROYOFFSEASON2027') {
          error.textContent = 'Incorrect password. Please try again.';
          document.getElementById('password').select();
          return;
        }

        var storage = remember ? localStorage : sessionStorage;
        (remember ? sessionStorage : localStorage).removeItem(accessKey);
        storage.setItem(accessKey, '1');
        storage.setItem('dd_user', JSON.stringify({ name: 'CBL User', role: 'admin', auth: 'password' }));
        localStorage.removeItem('dd_return_to');
        window.location.replace(returnTo);
      });
    })();
  </script>
</body>
</html>
